name: Refresh contribution graph

on:
  schedule:
    - cron: "0 6 * * *"  # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown
      # gh reads GH_TOKEN; the PAT (not GITHUB_TOKEN) is what lets private contributions count.
      # build.py skips the graph quietly on a gh error, so check the token first to fail loudly.
      - run: gh api user --jq .login && python build.py
        env:
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
      - run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh contribution graph"
          git push
